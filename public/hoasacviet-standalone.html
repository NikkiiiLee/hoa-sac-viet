  <script type="text/babel">

    // --- DATA DEFINITIONS ---
    const GARMENTS = {

    const COLORS = [
      { id: 'do_chu_sa', name: 'Đỏ Chu Sa', hex: '#B83227', element: 'Hỏa' },
      { id: 'xanh_cham', name: 'Xanh Chàm Đại Việt', hex: '#1B3B6F', element: 'Thủy' },

      { id: 'hong_tham', name: 'Hồng Thắm Yếm Đào', hex: '#D9536F', element: 'Hỏa' },
      { id: 'den_huyen', name: 'Đen Thâm Mực Nho', hex: '#1E1E22', element: 'Thủy' },

    function calculateAuthenticity(outfit) {
      let score = 100;
      let penalties = [];

      if (outfit.lapelDirection === 'ta_nham') {
        score -= 50;
        penalties.push('Cài vạt Tả nhậm (trái đè phải) là đại nghịch, quy chế dành cho tang lễ.');
      }
      if (outfit.bottom === 'quan_short_rach') {
        score -= 30;
        penalties.push('Đáy quần short rách lộ đùi qua tà xẻ, gây phản cảm mỹ cảm dân tộc.');
      }
      if (outfit.garmentId === 'ao_tac' && outfit.isSleeveRolled) {
        score -= 20;
        penalties.push('Xắn tay thụng Áo Tấc làm gãy nếp đại lễ nghiêm trang.');
      }
      if (outfit.headwear === 'tram_thanh_trieu') {
        score -= 20;
        penalties.push('Trâm cài Thanh triều là phụ kiện ngoại lai, không thuộc cổ phục Việt.');
      }
      if (outfit.outerwear === 'dai_obi') {
        score -= 25;
        penalties.push('Đai Obi to bản của Kimono Nhật Bản gây lai căng bản sắc.');
      }
      if (outfit.isSoloYem) {
        score -= 40;
        penalties.push('Mặc độc chiếc yếm lót ra nơi công cộng làm mất đi vẻ đoan trang.');
      }

      score = Math.max(0, score);
      return { score, penalties, isPerfect: score === 100 };
    }

    function calculateWuXingHarmony(mainColor, innerColor) {
      const sinhMap = {
        'Mộc': 'Hỏa',
        'Hỏa': 'Thổ',
        'Thổ': 'Kim',
        'Kim': 'Thủy',
        'Thủy': 'Mộc'
      };
      const khacMap = {
        'Thủy': 'Hỏa',
        'Hỏa': 'Kim',
        'Kim': 'Mộc',
        'Mộc': 'Thổ',
        'Thổ': 'Thủy'
      };
      const isSinh = sinhMap[mainColor.element] === innerColor.element || sinhMap[innerColor.element] === mainColor.element;
      const isKhac = khacMap[mainColor.element] === innerColor.element || khacMap[innerColor.element] === mainColor.element;
      if (isSinh) {
        return { score: 98, isSinh: true, isKhac: false, label: 'Tuyệt Phẩm Hài Hòa', phrase: `${innerColor.element} sinh ${mainColor.element}` };
      }
      if (isKhac) {
        return { score: 52, isSinh: false, isKhac: true, label: 'Cần Tinh Chỉnh', phrase: `${mainColor.element} khắc ${innerColor.element}` };
      }
      return { score: 88, isSinh: false, isKhac: false, label: 'Nhã Nhặn & Cân Bằng', phrase: 'Đồng điệu tương hòa' };
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('home'); // Default: 'home'
      const [currentUser, setCurrentUser] = useState(null); // null = Guest Mode, object = Member Mode
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [isAuthLoading, setIsAuthLoading] = useState(false);
      const [authTab, setAuthTab] = useState('login');
      const [authNotice, setAuthNotice] = useState(null);
      const [registeredUsers, setRegisteredUsers] = useState([
        { name: 'Minh An (UEH)', email: 'minhan.ueh@gmail.com', password: '••••••••' }
      ]);
      const [loginEmail, setLoginEmail] = useState('minhan.ueh@gmail.com');
      const [loginPassword, setLoginPassword] = useState('••••••••');
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
      const [savedLookbook, setSavedLookbook] = useState([
        { id: 'saved-1', title: 'Kỷ Yếu Dinh Độc Lập (Áo Tấc x Sneaker Retro)', garmentId: 'ao_tac', occasion: 'tot_nghiep', mainColor: COLORS[0], innerColor: COLORS[3], bottomColor: COLORS[3], gender: 'female', height: 165, weight: 52, isFavorite: true, createdAt: Date.now() - 3600000 * 2, date: 'Hôm nay' },
        { id: 'saved-2', title: 'Phố Thị Trí Thức (Áo Chẽn x Blazer)', garmentId: 'ao_chen', occasion: 'dao_pho', mainColor: COLORS[1], innerColor: COLORS[3], bottomColor: COLORS[3], gender: 'female', height: 165, weight: 52, isFavorite: true, createdAt: Date.now() - 3600000 * 28, date: 'Tuần này' }
      ]);
      const [isLookbookOpen, setIsLookbookOpen] = useState(false);
      const [lookbookTab, setLookbookTab] = useState('hub');
      const [timelineFilter, setTimelineFilter] = useState('all');
      const [garmentFilter, setGarmentFilter] = useState('all');
      const [occasionFilter, setOccasionFilter] = useState('all');
      const [onlyFavorites, setOnlyFavorites] = useState(false);
      const [isAlbumCreatorOpen, setIsAlbumCreatorOpen] = useState(false);
      const [selectedAlbumIds, setSelectedAlbumIds] = useState(['saved-1', 'saved-2']);
      const [albumName, setAlbumName] = useState('Bộ Sưu Tập Kỷ Yếu Dinh Độc Lập - Nhóm UEH 2026');
      const [generatedAlbumLink, setGeneratedAlbumLink] = useState(null);
      const [albumToast, setAlbumToast] = useState(null);
      const [isFeedbackModalOpen, setIsFeedbackModalOpen] = useState(false);
      const [feedbackTopic, setFeedbackTopic] = useState('chuan_muc_co_phuc');
      const [feedbackMessage, setFeedbackMessage] = useState('');
      const [feedbackError, setFeedbackError] = useState(null);
      const [feedbackShake, setFeedbackShake] = useState(false);
      const [isFeedbackSubmitting, setIsFeedbackSubmitting] = useState(false);
      const [feedbackToast, setFeedbackToast] = useState(null);
      const [isQuickGuideOpen, setIsQuickGuideOpen] = useState(false);
      const [tourStep, setTourStep] = useState(null);
      const [shakeKey, setShakeKey] = useState(0);
      const [isExporting, setIsExporting] = useState(false);

      useEffect(() => {
        if (activeTab === 'studio') {
          try {
            const hasSeen = localStorage.getItem('has_seen_studio_tour');
            if (!hasSeen) {
              localStorage.setItem('has_seen_studio_tour', 'true');
              setTourStep(1);
            }
          } catch (e) {}
        } else {
          setTourStep(null);
        }
      }, [activeTab]);
      const [showHotspots, setShowHotspots] = useState(true);
      const [activeHotspotId, setActiveHotspotId] = useState(null);
      const [hoveredHotspotId, setHoveredHotspotId] = useState(null);

      const [isBodyOpen, setIsBodyOpen] = useState(false);
      const [outfit, setOutfit] = useState({
        gender: 'female',
        garmentId: 'ao_tac',
        mainColor: COLORS[0],
        innerColor: COLORS[3],
        bottomColor: COLORS[3],
        lapelDirection: 'huu_nham',
        isSleeveRolled: false,
        isSoloYem: false,
        bottom: 'quan_lua',
        headwear: 'khan_dong',
        outerwear: 'none',
        height: 165,
        weight: 52
      });

      const authenticity = calculateAuthenticity(outfit);
      const harmony = calculateWuXingHarmony(outfit.mainColor, outfit.innerColor || COLORS[3]);

      const handleAiAutoFixColor = () => {
        const mainElem = outfit.mainColor.element;
        const genMap = {
          'Thủy': 'Kim',
          'Mộc': 'Thủy',
          'Hỏa': 'Mộc',
          'Thổ': 'Hỏa',
          'Kim': 'Thổ'
        };
        const target = genMap[mainElem] || 'Kim';
        const ideal = COLORS.find(c => c.element === target) || COLORS[3];
        setOutfit(prev => ({
          ...prev,
          innerColor: ideal,
          bottom: prev.bottom === 'quan_short_rach' ? 'quan_lua' : prev.bottom
        }));
        setFeedbackToast(`✨ AI Gemini đã cân bằng ngũ hành: ${ideal.element} sinh ${mainElem} – Sinh khí & Rạng rỡ trường tồn!`);
        setTimeout(() => setFeedbackToast(null), 3500);
      };

      const hotspots = [
        { id: 'collar', label: 'Cổ Áo', coords: { x: 150, y: 110 }, title: 'Cổ Lập Lĩnh / Giao Lĩnh', content: 'Cổ áo dựng tròn khít hoặc vạt chéo chữ V, biểu trưng cho sự ngay thẳng và khiêm cung.' },
        { id: 'buttons', label: 'Hàng Cúc', coords: outfit.lapelDirection === 'ta_nham' ? { x: 134, y: 145 } : { x: 168, y: 145 }, title: '5 Khuy Ngũ Thường', content: '5 hạt khuy biểu thị 5 đức tính: Nhân – Lễ – Nghĩa – Trí – Tín của người quân tử.' },
        { id: 'lapel', label: 'Mép Vạt', coords: outfit.lapelDirection === 'ta_nham' ? { x: 124, y: 175 } : { x: 176, y: 175 }, title: 'Quy Chuẩn Hữu Nhậm', content: 'Vạt phải luôn đè vạt trái theo đạo Dương của người sống. Cài Tả nhậm là cấm kỵ tang ma.' },
        { id: 'sleeves', label: 'Ống Tay', coords: { x: 80, y: 220 }, title: 'Ống Tay Áo', content: 'Tay chẽn năng động thường nhật, tay thụng 30-40cm ung dung khi hành đại lễ hoàng triều.' },
        { id: 'body', label: 'Thân Áo', coords: { x: 150, y: 260 }, title: 'Kết Cấu Ngũ Thân', content: 'Bốn thân ngoài tượng trưng tứ thân phụ mẫu; thân thứ năm chở che người mặc, biểu thị đạo Hiếu.' }
      ];

      const handleRestoreCompliant = () => {
        setOutfit(prev => ({
          ...prev,
          lapelDirection: 'huu_nham',
          isSleeveRolled: false,
          isSoloYem: false,
          bottom: 'quan_lua',
          headwear: 'khan_dong',
          outerwear: 'none'
        }));
        setShakeKey(prev => prev + 1);
      };

      const triggerChallenge = (updates) => {
        setOutfit(prev => ({ ...prev, ...updates }));
        setShakeKey(prev => prev + 1);
      };

      // 1-Click Launch Presets from Landing
      const handleLaunchConcept = (updates) => {
        setOutfit(prev => ({ ...prev, ...updates }));
        setActiveTab('studio');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Xuất ảnh Lookbook 9:16 chuẩn nét 2x với html2canvas - Tải file ảnh thật xuống máy tính
      const handleExportPNG = async () => {
        const element = document.getElementById('lookbook-story-card');
        if (!element) {
          console.error('Không tìm thấy khung thẻ id="lookbook-story-card"');
          return;
        }
        setIsExporting(true);
        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          await new Promise(r => setTimeout(r, 80));
          const sanitizeOklab = (clonedDoc) => {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const toStdColor = (val) => {
              if (!val) return '';
              const str = val.trim();
              if (!str || str === 'transparent' || str === 'inherit' || str === 'none') return str;
              if (!str.includes('oklab') && !str.includes('oklch')) return str;
              if (tempCtx) {
                try {
                  tempCtx.fillStyle = 'rgba(1, 2, 3, 0.5)';
                  tempCtx.fillStyle = str;
                  if (tempCtx.fillStyle !== 'rgba(1, 2, 3, 0.5)') return tempCtx.fillStyle;
                } catch(e) {}
              }
              return '#2C241D';
            };
            try {
              clonedDoc.querySelectorAll('style').forEach(s => {
                if (s.textContent && (s.textContent.includes('oklab') || s.textContent.includes('oklch'))) {
                  s.textContent = s.textContent
                    .replace(/oklab\([^)]+\)/gi, m => toStdColor(m))
                    .replace(/oklch\([^)]+\)/gi, m => toStdColor(m));
                }
              });
            } catch(e) {}
            try {
              const rootEl = clonedDoc.getElementById('lookbook-story-card') || clonedDoc.body;
              rootEl.querySelectorAll('*').forEach(el => {
                try {
                  const comp = window.getComputedStyle(el);
                  if (comp.color && (comp.color.includes('oklab') || comp.color.includes('oklch'))) el.style.color = toStdColor(comp.color);
                  if (comp.backgroundColor && (comp.backgroundColor.includes('oklab') || comp.backgroundColor.includes('oklch'))) el.style.backgroundColor = toStdColor(comp.backgroundColor);
                  if (comp.borderColor && (comp.borderColor.includes('oklab') || comp.borderColor.includes('oklch'))) el.style.borderColor = toStdColor(comp.borderColor);
                } catch(e) {}
              });
            } catch(e) {}
          };

          const canvas = await html2canvas(element, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: '#FFFDF8',
            onclone: sanitizeOklab
          });
          const safeTitle = (outfit.title || GARMENTS[outfit.garmentId]?.name || 'lookbook-story')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
          const fileName = `lookbook-${safeTitle}-${new Date().toISOString().slice(0, 10)}.png`;

          if (canvas.toBlob) {
            canvas.toBlob((blob) => {
              if (!blob) {
                const image = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = image;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                return;
              }
              const blobUrl = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = blobUrl;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
            }, 'image/png');
          } else {
            const image = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = image;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }
        } catch (err) {
          console.error('Lỗi khi xuất ảnh Lookbook:', err);
        } finally {
          setIsExporting(false);
        }
      };

      // Xuất và tải ảnh visualizer hiện tại thành PNG
      const handleExportVisualizerPNG = async () => {
        setIsExporting(true);
        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          const element = document.getElementById('visualizer-canvas-capture');
          if (!element) return;
          const canvas = await html2canvas(element, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#FAF7F2',
            ignoreElements: (el) => el.getAttribute('data-html2canvas-ignore') === 'true'
          });
          const image = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = image;
          link.download = `hoasacviet-${(GARMENTS[outfit.garmentId]?.name || 'ban-phoi')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')}.png`;
          link.click();
        } catch (err) {
          console.error('Lỗi khi tải ảnh visualizer:', err);
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF7F2] text-[#2C241D]">
          {/* THANH HEADER CHUẨN THỜI TRANG CÔNG NGHỆ 3 CỤM PHÂN MINH */}
          <header className="sticky top-0 z-[1000] bg-[#FDFAF5]/95 backdrop-blur-md border-b border-amber-200/50 shadow-xs px-4 sm:px-6 md:px-8 py-3 transition-all">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* 1. CỤM TRÁI: LOGO & SLOGAN (CÓ KHOẢNG ĐỆM TRÁI) */}
              <div 
                className="flex flex-col cursor-pointer select-none pl-2 sm:pl-4 group text-left"

                      setIsQuickGuideOpen(false);
                      setActiveTab('studio');
                      setTourStep(1);
                    }}
                    className="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-[#1B3B6F] bg-white border border-[#D6CEBE] rounded-2xl cursor-pointer"
                  >
                    🧭 Xem Tour Giới Thiệu Từng Bước
                  </button>
                  <button
                    onClick={() => {
                      setIsQuickGuideOpen(false);
                      setActiveTab('studio');
                    }}
                    className="w-full sm:w-auto px-7 py-3 text-xs sm:text-sm font-bold text-white bg-[#B83227] hover:bg-[#99261c] rounded-2xl shadow-lg cursor-pointer"
                  >
                    🚀 Bắt Đầu Phối Đồ Ngay
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* INTERACTIVE 4-STEP GUIDED TOUR SPOTLIGHT */}
          {activeTab === 'studio' && tourStep && (
            <>
              <div onClick={() => setTourStep(null)} className="fixed inset-0 bg-black/60 z-40 transition-all duration-300" />
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-xl bg-gradient-to-b from-[#FFFDF9] via-[#FAF7F2] to-[#F3EDE0] rounded-3xl border-2 border-[#D4AF37] shadow-2xl p-5 space-y-3 text-left">
                <div className="flex items-center justify-between pb-2 border-b border-[#E3DAC9]">
                  <span className="px-2.5 py-0.5 rounded-full bg-[#B83227] text-white text-[11px] font-bold">Bước {tourStep} / 4</span>
                  <button onClick={() => setTourStep(null)} className="text-[11px] font-bold text-[#7A6E5F] hover:text-[#B83227] cursor-pointer">✖ Bỏ qua tour</button>
                </div>
                <div className="font-serif font-bold text-sm sm:text-base text-[#2C241D]">
                  {tourStep === 1 && '1. Bắt đầu tại đây: Chọn sự kiện, thời tiết hoặc gõ câu lệnh tự nhiên cho Gemini Stylist.'}
                  {tourStep === 2 && '2. Tự do sáng tạo: Chọn loại cổ phục, màu sắc ngũ hành và các phụ kiện Gen Z thời thượng.'}
                  {tourStep === 3 && '3. Xem thay đổi trực tiếp: Ngắm trang phục thay đổi theo thời gian thực và theo dõi Thước đo Chuẩn mực Di sản.'}
                  {tourStep === 4 && '4. Lan tỏa thành phẩm: Bấm Xuất Lookbook để tạo ảnh thẻ 9:16 chia sẻ lên Story mạng xã hội!'}
                </div>
                <div className="flex items-center justify-end gap-2 pt-2 border-t border-[#E3DAC9]">
                  {tourStep > 1 && (
                    <button onClick={() => setTourStep(tourStep - 1)} className="px-3.5 py-1.5 text-xs font-bold bg-white border border-[#D6CEBE] rounded-xl cursor-pointer">⬅ Quay Lại</button>
                  )}
                  <button
                    onClick={() => setTourStep(tourStep < 4 ? tourStep + 1 : null)}
                    className="px-4 py-1.5 text-xs font-bold text-white bg-[#B83227] rounded-xl cursor-pointer"
                  >
                    {tourStep < 4 ? 'Tiếp Tục ➔' : 'Hoàn Tất'}
                  </button>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
